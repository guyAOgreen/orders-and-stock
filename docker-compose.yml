# Credentials come from .env (copy .env.example), which Compose reads automatically.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      # Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the test database alongside the development one on first start.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres-data:
