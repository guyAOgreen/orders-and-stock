[project]
name = "orders-stock"
version = "0.1.0"
description = "Orders and stock core flow: a minimal orders API with a stock worker, on PostgreSQL."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.142.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
]

[project.scripts]
orders-stock-api = "orders_stock.api.main:main"
orders-stock-worker = "orders_stock.worker_main:main"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "orders_stock"

[tool.ruff]
line-length = 88
target-version = "py312"
# Vendored skills are third-party content; leave them as their authors wrote them.
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
# The alembic/ directory holds our migrations; the alembic package is third-party.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "alembic/env.py"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "ruff>=0.16.10",
]

[tool.fastapi]
entrypoint = "orders_stock.api.main:app"
